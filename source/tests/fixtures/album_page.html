<!DOCTYPE html>
<!--
  测试夹具（fixture）—— 合成页面，不是从真实站点抓下来的原样 HTML。

  它的作用：在没有网络、或者站点拒绝访问的情况下，也能验证"解析规则"是否正确。
  它刻意模仿了在真实站点上**已观察到**的链接约定：
    · 曲目链接以 .mp3 结尾（其实是详情页，不是音频文件）；
    · 同一首曲目在页面上会出现多次（下载 / 时长 / 大小等列），需要去重；
    · 链接是根相对路径（以 / 开头），需要用 urljoin 拼成绝对地址；
    · 文件名里的空格是双重编码的 %2520；
    · 曲名可能含日文等非 ASCII 字符。

  页面里还故意放了多种"干扰链接"（导航、相关专辑、论坛、变更日志），
  用来验证解析规则确实被限制在本专辑范围内。
-->
